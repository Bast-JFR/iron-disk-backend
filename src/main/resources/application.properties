spring.application.name=iron-disk-backend
server.port=8080

# Las claves se leen del archivo .env, que no se sube a GitHub
spring.config.import=optional:file:.env[.properties]

# Base de datos MySQL (en Docker el puerto del computador es 3307)
spring.datasource.url=jdbc:mysql://localhost:3307/irondisk_db?serverTimezone=America/Santiago&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}

# JPA crea y actualiza las tablas a partir de las entidades
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
