spring.application.name=iron-disk-backend
server.port=8080

# Las claves se leen del archivo .env, que no se sube a GitHub
spring.config.import=optional:file:.env[.properties]

# Base de datos MySQL (en Docker el puerto del computador es 3307)
spring.datasource.url=jdbc:mysql://localhost:3307/irondisk_db?serverTimezone=America/Santiago&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}

# JPA crea y actualiza las tablas a partir de las entidades
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# JWT: el token de acceso dura 15 minutos y el de renovacion 7 dias
jwt.secret=${JWT_SECRET}
jwt.access-expiration-ms=900000
jwt.refresh-expiration-ms=604800000

# CORS: direcciones desde donde se conecta el frontend React
app.cors.origenes=http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173,http://127.0.0.1:5173
