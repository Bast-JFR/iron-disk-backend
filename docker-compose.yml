services:

  # Base de datos MySQL del backend
  mysql:
    image: mysql:8.4
    container_name: irondisk-mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?define DB_PASSWORD en el archivo .env}
      MYSQL_DATABASE: irondisk_db
      TZ: America/Santiago
    ports:
      # 3307 en el computador y 3306 dentro del contenedor, para no chocar con otro MySQL
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql_data:
